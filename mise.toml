# Every tool and task for the repo. Tasks are named <action>:<component>, and
# the bare `test` and `lint` run all of their components.
#
# In production the server reads DATABASE_URL, JWT_SECRET_KEY,
# RESEND_API_KEY, SECRET_KEY_BASE, PHX_HOST and APP_URL from the environment. Deployed
# secrets live age-encrypted in fnox.toml (profiles staging and production)
# and are copied to Railway with the secrets:push:* tasks. Dev and
# test need none of them; to override one locally put it in a gitignored
# mise.local.toml, e.g.
#   [env]
#   DATABASE_URL = "postgresql://localhost/qot_dev"
# They are not marked `required` here, because that would make every task,
# CLI ones included, refuse to run without the server's secrets.

[tools]
rust = { version = "1.98.1", components = "clippy,rustfmt", targets = "aarch64-apple-ios,aarch64-apple-ios-sim,wasm32-unknown-unknown" }
erlang = "29.1.2"
elixir = "1.20.5-otp-29"
# Builds and publishes CLI releases (`dist`); .github/workflows/cli-release.yml
# is generated from dist-workspace.toml by it.
cargo-dist = "0.33.1"
# Generates the JS bindings for core_wasm and runs its tests in Node; must
# equal the `wasm-bindgen` crate version in core_wasm/Cargo.toml.
"github:wasm-bindgen/wasm-bindgen" = "0.2.130"
# Builds and tests client_web (the PWA) and site_web (the website).
node = "24.22.2"
# wasm-opt: shrinks the release build of core_wasm.
"github:WebAssembly/binaryen" = "version_129"

[tasks."test:rust"]
description = "Test the Rust workspace (core + CLI)"
run = "cargo test --workspace"

[tasks."test:server"]
description = "Test the Phoenix server"
dir = "server_web"
run = "mix test"

[tasks."test:apple"]
description = "Test QotKit (Swift, against the Rust core) and build the iOS app; skipped off macOS"
run = """
if [ "$(uname)" != Darwin ]; then echo "test:apple skipped: needs macOS and Xcode"; exit 0; fi
scripts/build-apple-core
(cd client_apple/QotKit && swift test)
xcodebuild -quiet -project client_apple/Qot.xcodeproj -scheme Qot \
  -destination 'generic/platform=iOS Simulator' -derivedDataPath target/xcode build
"""

[tasks."test:wasm"]
description = "Test qot_wasm as JavaScript sees it, in Node"
run = "cargo test -p qot_wasm --target wasm32-unknown-unknown"

[tasks."test:web"]
description = "Test the PWA (client_web)"
depends = ["build:wasm-core", "deps:web"]
dir = "client_web"
run = "npm test"

[tasks."e2e:web"]
description = "The PWA end to end in headless Chromium, against a local server and the CLI (needs Postgres)"
depends = ["build:wasm-core", "deps:web"]
run = ["cargo build -p qot_cli", "cd client_web && npm run e2e"]

[tasks."test:site"]
description = "Build the website (site_web) and check every page, link and the no-scripts rule"
depends = ["build:site"]
dir = "site_web"
run = "npm test"

[tasks.test]
description = "Test everything"
depends = ["test:rust", "test:wasm", "test:web", "test:site", "test:server", "test:apple"]

[tasks."lint:rust"]
description = "rustfmt check and clippy, warnings as errors"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo clippy -p qot_wasm --all-targets --target wasm32-unknown-unknown -- -D warnings",
]

[tasks."lint:web"]
description = "Typecheck the PWA"
depends = ["build:wasm-core", "deps:web"]
dir = "client_web"
run = "npm run lint"

[tasks."lint:site"]
description = "Typecheck the website (astro check)"
depends = ["deps:site"]
dir = "site_web"
run = "npm run lint"

[tasks.lint]
description = "Lint everything"
depends = ["lint:rust", "lint:web", "lint:site"]

[tasks."build:apple-core"]
description = "Build qot_core for Apple (XCFramework + Swift bindings); rerun after Rust changes"
run = "scripts/build-apple-core"

[tasks."build:wasm-core"]
description = "Build qot_core for the browser (client_web/src/core); rerun after Rust changes"
run = "scripts/build-wasm-core"

[tasks."deps:web"]
description = "Install the PWA's npm dependencies"
dir = "client_web"
run = "npm ci --no-audit --no-fund"

[tasks."build:web"]
description = "Build the PWA for production into client_web/dist"
depends = ["deps:web"]
dir = "client_web"
run = ["../scripts/build-wasm-core --release", "npm run build"]

[tasks."dev:web"]
alias = "w"
description = "Run the PWA's dev server (http://localhost:5173) against the local API"
depends = ["build:wasm-core", "deps:web"]
dir = "client_web"
run = "npm run dev"

[tasks."deps:site"]
description = "Install the website's npm dependencies"
dir = "site_web"
run = "npm ci --no-audit --no-fund"

[tasks."build:site"]
description = "Build the website (www.quantumofthought.com) into site_web/dist"
depends = ["deps:site"]
dir = "site_web"
run = "npm run build"

[tasks."dev:site"]
description = "Run the website's dev server (http://localhost:4321)"
depends = ["deps:site"]
dir = "site_web"
run = "npm run dev"

[tasks.xcode]
description = "Build the Apple core, then open client_apple/Qot.xcodeproj in Xcode"
depends = ["build:apple-core"]
run = "open client_apple/Qot.xcodeproj"

[tasks.server]
alias = "s"
description = "Start the Phoenix server in IEx"
dir = "server_web"
run = "iex -S mix phx.server"

[tasks."secrets:push:staging"]
description = "Copy fnox's staging secrets to Railway and redeploy staging"
run = "scripts/secrets-push staging"

[tasks."secrets:push:production"]
description = "Copy fnox's production secrets to Railway and redeploy production"
run = "scripts/secrets-push production"

[tasks.cli-install]
alias = "ci"
description = "Install the qot binary"
run = "cargo install --path client_cli"
