# Tools and tasks for the whole repo. Each component that needs more (the
# server's Erlang/Elixir and its environment) has its own mise.toml, which
# mise layers on top of this one inside that directory.

[tools]
rust = { version = "1.98.1", components = "clippy,rustfmt" }

[tasks.test]
description = "Test the Rust workspace (core + CLI)"
run = "cargo test --workspace"

[tasks.lint]
description = "Format check and clippy, warnings as errors"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
]

[tasks.cli-install]
alias = "ci"
description = "Install the qot binary from client_cli"
run = "cargo install --path client_cli"
