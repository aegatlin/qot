[tools]
elixir = "1.19.1-otp-28"
erlang = "28.1.1"

[env]
DATABASE_URL = { required = "For local development update mise.local.toml, e.g., postgresql://localhost/qot_dev" }
FRONTEND_URL = { required = "For local env update mise.local.toml, e.g., http://localhost:5173" }
JWT_SECRET_KEY = { required = "Secret key for signing JWT tokens" }
RESEND_API_KEY = { required = "API key from resend.com" }

[tasks.test]
description = "Server tests"
run = "mix test"

[tasks.server]
alias = "s"
description = "Start the Phoenix server in IEx"
run = "iex -S mix phx.server"
