# The Xcode project is generated from this file (`mise run gen:apple`); the
# .xcodeproj is gitignored, so edit this, not the project. One project holds
# every Apple target (iPhone now; widgets, intents, Watch and Mac later). See
# docs/records/2026-11-04-repo-layout-for-clients.md.
name: Qot
options:
  bundleIdPrefix: llc.abstractsyntax
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: H88537CLVC
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The Rust core is built for Apple silicon only (scripts/build-apple-core).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
packages:
  QotKit:
    path: QotKit
targets:
  Qot:
    type: application
    platform: iOS
    # Shared/ is compiled into the app and its extensions.
    sources: [App, Shared]
    dependencies:
      - package: QotKit
      - target: QotWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Background sync (BackgroundSync in QotApp.swift).
        BGTaskSchedulerPermittedIdentifiers: [llc.abstractsyntax.qot.sync]
        UIBackgroundModes: [fetch]
        # Plain HTTP only to a dev server on the local network
        # (`--server http://localhost:4000` from the simulator).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # qot://capture opens the app ready to type (widgets).
        CFBundleURLTypes:
          - CFBundleURLName: llc.abstractsyntax.qot
            CFBundleURLSchemes: [qot]
        # Siri also answers to the full name.
        INAlternativeAppNames:
          - INAlternativeAppName: Quantum of Thought
        # Capture by voice, transcribed on the device (Dictation.swift).
        NSMicrophoneUsageDescription: qot listens while you dictate a note.
        NSSpeechRecognitionUsageDescription: qot turns what you say into a note's text, on this device.
    # The App Group holds the note store every target shares (#28).
    entitlements:
      path: App/Qot.entitlements
      properties:
        com.apple.security.application-groups:
          - group.llc.abstractsyntax.qot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: llc.abstractsyntax.qot
        PRODUCT_NAME: Qot
        INFOPLIST_KEY_CFBundleDisplayName: qot
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  # Control Center control, Lock Screen and Home Screen widgets (#30).
  QotWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: QotKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: qot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/QotWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.llc.abstractsyntax.qot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: llc.abstractsyntax.qot.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  Qot:
    build:
      targets:
        Qot: all
    test:
      targets: []
