# Secrets for every environment, age-encrypted at rest and committed. Decrypting
# needs the age key in ~/.config/fnox/age.txt. Profiles: staging, production.
#   fnox -P staging list
#   mise run secrets:push:staging     # copy a profile's secrets to Railway
default_provider = "age"

[providers.age]
type = "age"
recipients = ["age1tr5zp4lz6ftrkmcx38uc4mszxnnryy7n08l78pwcwz4aqg5lk3uqc9cr9n"]

[profiles]

[profiles.staging]

[profiles.staging.secrets]
JWT_SECRET_KEY= { provider = "age", value = "", description = "server, Railway staging" }
SECRET_KEY_BASE= { provider = "age", value = "", description = "server, Railway staging" }

[profiles.production]

[profiles.production.secrets]
JWT_SECRET_KEY= { provider = "age", value = "", description = "server, Railway production" }
SECRET_KEY_BASE= { provider = "age", value = "", description = "server, Railway production" }
