[package]
name = "qot_cli"
version = "0.2.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Quantum of Thought: capture a note from anywhere (`qot get milk`)"
homepage = "https://quantumofthought.com"

[package.metadata.dist]
# The Homebrew formula is `qot` (brew install aegatlin/tap/qot), not qot-cli.
formula = "qot"

[[bin]]
name = "qot"
path = "src/main.rs"

[dependencies]
qot_core = { path = "../core" }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = "1.29.0"
ureq = { version = "3.5.0", features = ["json"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
httpmock = "0.9.0"
