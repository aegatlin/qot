[workspace]
resolver = "3"
members = ["core", "core_ffi", "core_wasm", "client_cli"]

[workspace.package]
license = "AGPL-3.0-only"
repository = "https://github.com/aegatlin/qot"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# The browser downloads qot_wasm, so it is built for size
# (scripts/build-wasm-core --release, which also runs wasm-opt). Debug info
# is stripped but symbols aren't: wasm-bindgen reads the target_features
# section that a full strip removes, and wasm-opt drops the names after.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
