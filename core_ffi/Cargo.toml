[package]
name = "qot_ffi"
version = "0.1.0"
edition = "2024"
description = "qot_core for Swift and Kotlin, through UniFFI"

[lib]
crate-type = ["lib", "staticlib"]
name = "qot_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
qot_core = { path = "../core" }
uniffi = "=0.32.2"
serde_json = "1.0.154"
