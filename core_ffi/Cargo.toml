[package]
name = "qot_ffi"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "qot_core for Swift and Kotlin, through UniFFI"

# uniffi-bindgen is a build tool for client_apple, not something to release.
[package.metadata.dist]
dist = false

[lib]
crate-type = ["lib", "staticlib"]
name = "qot_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
qot_core = { path = "../core" }
uniffi = "=0.32.2"
serde_json = "1.0.154"
