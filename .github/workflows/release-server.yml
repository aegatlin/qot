name: Release server

# Production deploys from tags: push a `server/v<version>` tag on a commit
# that is on main. This runs CI on it, then moves the `production` branch to
# it; Railway's production environment deploys that branch. Staging deploys
# every green push to main that touches server_web/ on its own.
#
#   git tag server/vX.Y.Z && git push origin server/vX.Y.Z   # the next version
#
# (Before 2026-11-06 the tags were server-v*: server-v0.1.0, server-v0.1.1.)
#
# Tagging an older commit and pushing it rolls production back to it. Once
# production has moved, smoke.yml waits for the new release and checks it.
#
# Railway's production environment must not have a watch pattern: Railway
# checks only the files the pushed commit changed, so a tag on a commit that
# didn't touch server_web/ would be skipped.

on:
  push:
    tags: ["server/v*"]

concurrency:
  group: release-server
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  promote:
    needs: ci
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://api.quantumofthought.com
    permissions:
      contents: read
    steps:
      # The push below goes over SSH with a deploy key (RELEASE_DEPLOY_KEY, a
      # secret of the `production` environment; write access to this repo
      # only). The workflow's own GITHUB_TOKEN can't do it: GitHub refuses a
      # push from it that brings workflow file changes to a branch, and it
      # can't be given the `workflows` permission.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: The tagged commit must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          }
      - name: Move production to the tag
        run: git push --force origin "$GITHUB_SHA:refs/heads/production"

  smoke:
    needs: promote
    uses: ./.github/workflows/smoke.yml
    with:
      environment: production
      sha: ${{ github.sha }}
