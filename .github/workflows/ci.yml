name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Release workflows run the same checks on the tagged commit first.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tool versions are read from mise.toml so it stays the single source of truth.
  versions:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.read.outputs.rust }}
      erlang: ${{ steps.read.outputs.erlang }}
      elixir: ${{ steps.read.outputs.elixir }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        run: |
          rust=$(sed -nE 's/^rust = \{ version = "([^"]+)".*/\1/p' mise.toml)
          erlang=$(sed -nE 's/^erlang = "([^"]+)"/\1/p' mise.toml)
          elixir=$(sed -nE 's/^elixir = "([^"-]+)(-otp-[0-9]+)?"/\1/p' mise.toml)
          test -n "$rust" && test -n "$erlang" && test -n "$elixir"
          echo "rust=$rust erlang=$erlang elixir=$elixir"
          {
            echo "rust=$rust"
            echo "erlang=$erlang"
            echo "elixir=$elixir"
          } >> "$GITHUB_OUTPUT"

  rust:
    needs: versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.versions.outputs.rust }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  server:
    needs: versions
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server_web
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MIX_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ needs.versions.outputs.erlang }}
          elixir-version: ${{ needs.versions.outputs.elixir }}
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            server_web/deps
            server_web/_build
          key: mix-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ hashFiles('server_web/mix.lock') }}
          restore-keys: mix-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-
      - run: mix deps.get --check-locked
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  # The PWA's image (client_web/Dockerfile, built from the repo root).
  docker-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: client_web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # The image Railway builds; catches a broken Dockerfile or release before
  # it reaches staging.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server_web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # core_wasm and the PWA (client_web): unit tests against the real core,
  # then end to end in Chromium with the server and the CLI.
  web:
    needs: versions
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v5
      # Rust, Node and the wasm tools at the versions mise.toml pins; Erlang
      # and Elixir (for the e2e server) as the server job installs them.
      - uses: jdx/mise-action@v3
        with:
          install_args: rust node github:wasm-bindgen/wasm-bindgen github:WebAssembly/binaryen
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ needs.versions.outputs.erlang }}
          elixir-version: ${{ needs.versions.outputs.elixir }}
          version-type: strict
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            server_web/deps
            server_web/_build
          key: mix-dev-${{ needs.versions.outputs.erlang }}-${{ needs.versions.outputs.elixir }}-${{ hashFiles('server_web/mix.lock') }}
      - name: client_web/Dockerfile pins what mise.toml pins
        run: |
          check() {
            local name=$1 docker mise
            docker=$(sed -nE "s/^ARG $name=(.+)/\1/p" client_web/Dockerfile)
            mise=$2
            [ "$docker" = "$mise" ] || { echo "::error::client_web/Dockerfile $name=$docker, mise.toml has $mise"; exit 1; }
          }
          check RUST_VERSION "$(sed -nE 's/^rust = \{ version = "([^"]+)".*/\1/p' mise.toml)"
          check NODE_VERSION "$(sed -nE 's/^node = "([^"]+)"/\1/p' mise.toml)"
          check WASM_BINDGEN_VERSION "$(sed -nE 's|^"github:wasm-bindgen/wasm-bindgen" = "([^"]+)"|\1|p' mise.toml)"
          check BINARYEN_VERSION "$(sed -nE 's|^"github:WebAssembly/binaryen" = "([^"]+)"|\1|p' mise.toml)"
      - run: cargo clippy -p qot_wasm --all-targets --locked --target wasm32-unknown-unknown -- -D warnings
      - run: mise run test:wasm
      - run: mise run lint:web
      - run: mise run test:web
      - run: mise run build:web
      - run: cd server_web && mix deps.get
      - run: cd client_web && npx playwright install --with-deps chromium
      # What `mise run e2e:web` runs, but outside mise: inside it, mise points
      # MIX_HOME at its own Elixir, which CI doesn't install, so Mix wouldn't
      # find the Hex that setup-beam installed.
      - run: cargo build -p qot_cli --locked
      - run: cd client_web && npm run e2e
        env:
          CI: "1"
