name: Smoke test site

# After a deploy of the website, checks that it works (scripts/smoke-test-site):
# waits until /health reports the deployed commit, then checks every page, the
# 404, the clean-URL redirects and the CSP.
#
# - Staging: on each staging deploy Railway reports. Staging must run the last
#   commit that changed site_web/ (Railway's watch pattern) or a later one; if
#   Railway skipped that deploy (#68), this fails instead of passing.
# - Production: called by release-site.yml once production-site has moved.
# - By hand: Actions -> Smoke test site -> Run workflow.

on:
  # Railway reports each deploy as a GitHub deployment ("qot / staging").
  # Not workflow_run after CI: Railway's "wait for CI" waits for every
  # Actions run on the commit, so a smoke run started before Railway
  # deployed held the deploy until it timed out, and Railway skipped it (#68).
  deployment_status:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
      sha:
        description: Commit to wait for (empty = whatever is deployed)
        type: string
        required: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    concurrency:
      group: smoke-site-${{ inputs.environment || 'staging' }}
      cancel-in-progress: true
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment.environment == 'qot / staging' &&
       contains(fromJSON('["success", "failure", "error"]'), github.event.deployment_status.state))
    steps:
      - uses: actions/checkout@v5
        with:
          # Whole history: staging is checked against the last commit that
          # changed this service, which may be far back.
          fetch-depth: 0
          ref: ${{ github.event.deployment.sha || inputs.sha || github.sha }}
      - id: target
        env:
          EVENT: ${{ github.event_name }}
          STATE: ${{ github.event.deployment_status.state }}
          ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          SHA: ${{ github.event.deployment.sha || inputs.sha }}
        run: |
          case "$ENVIRONMENT" in
            staging) site=https://staging-www.quantumofthought.com ;;
            production) site=https://www.quantumofthought.com ;;
            *) echo "::error::unknown environment $ENVIRONMENT"; exit 1 ;;
          esac
          want=$SHA
          if [ "$EVENT" = deployment_status ] && [ "$STATE" != success ]; then
            echo "::error::Railway reports the staging deploy of $SHA as $STATE"; exit 1
          fi
          if [ "$EVENT" = deployment_status ]; then
            # Railway deploys a service only when the pushed commit touches
            # its paths, and can skip one (#68). So staging must run the last
            # commit that changed them, or a later one (a manual redeploy);
            # anything older is a skipped deploy, and the smoke test fails
            # instead of passing quietly.
            last=$(git log -1 --format=%H HEAD -- site_web)
            want="$last $(git rev-list "$last"..HEAD | tr '\n' ' ')"
            echo "staging should run $last (the last change to site_web/) or later"
          fi
          {
            echo "site=$site"
            echo "want=$want"
          } >> "$GITHUB_OUTPUT"
      - env:
          SITE: ${{ steps.target.outputs.site }}
          SHA: ${{ steps.target.outputs.want }}
        run: scripts/smoke-test-site "$SITE" "$SHA"
